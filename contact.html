<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact - Second Chance</title>

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/navbar.css">
<link rel="stylesheet" href="css/contact.css">
<link rel="stylesheet" href="css/footer.css">

<!-- BREVO REQUIRED -->
<link rel="stylesheet" href="https://sibforms.com/forms/end-form/build/sib-styles.css">
<style>
#sib-container {
    border-radius: 12px !important;
    padding: 30px !important;
}
</style>

</head>

<body>

<main class="contact-page">

<h1>Contact Us</h1>

<div class="contact-layout">

<!-- CONTACT FORM -->
<div>
<form id="contact-form">
<input type="text" placeholder="Name" required>
<input type="email" placeholder="Email" required>
<textarea placeholder="Message"></textarea>
<button type="submit">Send</button>
</form>
</div>

</div>

<!-- 🔥 NEWSLETTER (WORKING BREVO EMBED) -->
<section style="margin-top:80px; text-align:center;">

<h2>Join Our Newsletter</h2>
<p>Get updates on product progress and clinical pilots.</p>

<div class="sib-form">
  <div id="sib-form-container" class="sib-form-container">

    <!-- SUCCESS MESSAGE -->
    <div id="success-message" class="sib-form-message-panel"
         style="display:none; color:green;">
      Subscription successful.
    </div>

    <!-- ERROR MESSAGE -->
    <div id="error-message" class="sib-form-message-panel"
         style="display:none; color:red;">
      Something went wrong.
    </div>

    <div id="sib-container" class="sib-container--large sib-container--vertical">

      <form id="sib-form" method="POST"
      action="https://9e0a87df.sibforms.com/serve/MUIFAB3C9ZKeY_0M70nokRJrxbocmX1ErvL1ZV565H8NLSzIr5ndPBKUMzlNTnUG0MldmvWGw1rTTWIczbVNA0CxinE8zesq8lybjEpVcmiIsTqOhkiA9i7gHWXWMy97jBKbkQsYZZJfiurP2t_Kb0m2_RKD_5-5FSpJmrkW95PdxYT47q3KB4Ooc4c3ktdfycOXsh4iTsNFvbRFFQ=="
      data-type="subscription">

        <div class="sib-input sib-form-block">
          <div class="form__entry entry_block">

            <label>Email</label>

            <input class="input"
                   type="email"
                   id="EMAIL"
                   name="EMAIL"
                   required
                   placeholder="you@example.com"/>

          </div>
        </div>

        <button type="submit">Subscribe</button>

        <!-- REQUIRED HIDDEN FIELDS -->
        <input type="text" name="email_address_check" value="" class="input--hidden">
        <input type="hidden" name="locale" value="en">

      </form>
    </div>
  </div>
</div>

</section>

</main>

<footer>
<p>© 2026 Second Chance</p>
</footer>

<!-- BREVO SCRIPT (CRITICAL) -->
<script>
window.REQUIRED_ERROR_MESSAGE = "This field cannot be left blank.";
window.EMAIL_INVALID_MESSAGE = "Invalid email.";
</script>

<script defer src="https://sibforms.com/forms/end-form/build/main.js"></script>

</body>
</html>
