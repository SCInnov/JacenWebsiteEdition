<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SCI circuit logo">
<style>

    .wipe {
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(0);
      animation: wipeIn var(--dur) cubic-bezier(.6,.05,.15,1) var(--delay) forwards;
    }
    @keyframes wipeIn { to { transform: scaleX(1); } }

    .logo-piece { fill: #0a0a0a; }

    .glow-group {
      animation: glow 2.6s ease-in-out 2.9s infinite;
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 0px rgba(0,0,0,0)); }
      50%      { filter: drop-shadow(0 0 5px rgba(0,0,0,.3)); }
    }

</style>
